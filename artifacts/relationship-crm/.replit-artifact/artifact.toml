kind = "web"
previewPath = "/"
title = "Full Circle"
description = "A simple, focused CRM for freelancers and small businesses to organize professional contacts, track follow-ups, and record relationship history."
version = "1.0.0"
id = "artifacts/relationship-crm"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20304

[services.development]
run = "pnpm --filter @workspace/relationship-crm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/relationship-crm", "run", "build" ]
serve = "static"
publicDir = "artifacts/relationship-crm/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20304"
BASE_PATH = "/"
